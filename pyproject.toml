[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-output-guard"
version = "0.0.1"
description = "Starlette middleware + CLI to scan/redact risky LLM outputs."
readme = "README.md"
requires-python = ">=3.9"
# Keep runtime deps minimal; Starlette is required, uvicorn is only for examples.
dependencies = [
  "starlette>=0.37",
  "anyio>=4",
  "typing-extensions>=4.10",
]

# Optional extras you can install with: pip install -e ".[test,dev]"
[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "uvicorn[standard]>=0.30",  # for running examples in tests if needed
]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=7.0",
  "pytest-cov>=5",
  "types-requests",
  "types-typed-ast; python_version<'3.11'",
]

[tool.setuptools.packages.find]
# Ensure the llm_output_guard package (and subpackages) are discovered.
include = ["llm_output_guard*"]

# If you have non-Python files to ship (e.g., example policies), uncomment and adjust:
# [tool.setuptools.package-data]
# "llm_output_guard" = ["policy/examples/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
