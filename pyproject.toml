[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-output-guard"
version = "0.0.1"
description = "Starlette middleware + CLI to scan/redact risky LLM outputs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "anyio>=4", "typing-extensions>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E","F","I","UP"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
addopts = "-q"
