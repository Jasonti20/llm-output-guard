repos:
  - repo: local
    hooks:
      - id: llm-output-guard-scan
        name: LLM Output Guard (md/txt/json)
        entry: bash
        args:
          - -c
          - |
            ROOT="$(git rev-parse --show-toplevel)"
            PY="$ROOT/.venv/bin/python"
            if [ ! -x "$PY" ]; then
              PY="$(command -v python3 || command -v python || true)"
            fi
            if [ -z "$PY" ]; then
              echo "[guard] ERROR: No python interpreter found" >&2
              exit 127
            fi

            ec=0
            for f in "$@"; do
              # make path relative to repo root so pattern matches are stable
              rel="${f#$ROOT/}"

              case "$rel" in
                # hard-skip our known-risky traces
                examples/traces_before_after/*) continue ;;
                # scan only text-ish files
                *.md|*.markdown|*.txt|*.json)
                  echo "[guard] scanning $rel"
                  "$PY" -m llm_output_guard.cli.main scan --in "$f" --format pretty
                  rc=$?
                  # fail commit on redact(2) or block(3)
                  if [ $rc -ge 2 ]; then ec=$rc; fi
                  ;;
                *) ;;
              esac
            done
            exit ${ec:-0}
        language: system
        pass_filenames: true
        require_serial: false
        stages: [pre-commit]
        # optional backup regex; fine to keep
        exclude: |
          ^examples/traces_before_after/.*
